services:
  unflare:
    build: .
    image: unflare
    container_name: unflare
    ports:
      - "5002:5002"

  bypass-cloudflare-proxy:
    build:
      context: ./bypass-cloudflare-proxy
    container_name: bypass-cloudflare-proxy
    ports:
      - "5003:5003"
    environment:
      - UNFLARE_URL=${UNFLARE_URL:-http://unflare:5002}
      - ADDON_PORT=${ADDON_PORT:-5003}
      - DOMAIN_WHITELIST=${DOMAIN_WHITELIST:-} # Optional: Comma-separated list of allowed domains (e.g., example.com,test.com)
    depends_on:
      - unflare
    volumes:
      - ./bypass-cloudflare-proxy/script.js:/usr/src/app/script.js

  xml-processor:
    build:
      context: ./xml-processor
    container_name: xml-processor
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - ADDON_HOST=${ADDON_HOST:-bypass-cloudflare-proxy}
      - ADDON_PORT=${ADDON_PORT:-5003}
      - PUBLIC_PROXY_URL=${PUBLIC_PROXY_URL:-}
    depends_on:
      - bypass-cloudflare-proxy
    volumes:
      - ./xml-processor/processor.js:/usr/src/app/processor.js